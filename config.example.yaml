# postgres-provisioner configuration example
#
# Environment variable interpolation: use ${VAR_NAME} syntax.
# Unresolved variables are left as-is (useful for detecting misconfig).
#
# Strategy: "update" (default) creates or updates resources.
#           "create" only creates if missing, skips existing.
# Set globally or per resource (resource strategy overrides global).
# strategy: "update"

roles:
  - name: "app_user"
    password: "${APP_DB_PASSWORD}"     # resolved from environment
    options:
      login: true
      superuser: false
      createdb: false
      createrole: false
      connection_limit: -1             # unlimited

  - name: "readonly_user"
    password: "${READONLY_DB_PASSWORD}"
    options:
      login: true

databases:
  - name: "myapp"
    owner: "app_user"
    # options: create-time only. These cannot be changed with ALTER DATABASE;
    # if the database already exists they are ignored (a warning is logged).
    #   encoding:   character set encoding (e.g. UTF8)
    #   locale:     sets LC_COLLATE and LC_CTYPE together (mutually exclusive
    #               with lc_collate / lc_ctype below)
    #   lc_collate: string sort order (e.g. C)
    #   lc_ctype:   character classification (e.g. C)
    #   template:   template database to clone (e.g. template0)
    # options:
    #   encoding: "UTF8"
    #   lc_collate: "C"
    #   lc_ctype: "C"
    #   template: "template0"
    extensions:
      - "uuid-ossp"
      - "pgcrypto"
    schemas:
      - name: "app"
        owner: "app_user"             # optional, defaults to database owner
    grants:
      - role: "app_user"
        privileges: ["ALL"]
        on_schema: "app"              # GRANT ALL ON SCHEMA app TO app_user

      - role: "readonly_user"
        privileges: ["CONNECT"]
        on_database: true             # GRANT CONNECT ON DATABASE myapp TO readonly_user

      - role: "readonly_user"
        privileges: ["USAGE"]
        on_schema: "app"              # GRANT USAGE ON SCHEMA app TO readonly_user

      - role: "readonly_user"
        privileges: ["SELECT"]
        on_tables_in_schema: "app"    # GRANT SELECT ON ALL TABLES + ALTER DEFAULT PRIVILEGES

    # migrations:                       # optional: Flyway-style SQL migrations
    #   directory: "./migrations/myapp" # supports ${VAR} expansion
    #                                   # File naming:
    #                                   #   V0001__create_users.sql  → versioned (run once, immutable)
    #                                   #   R0001__seed_data.sql     → repeatable (re-run on change)
    #                                   # Tracked via _schema_migrations table with SHA-256 checksums
