# postgres-provisioner configuration example
#
# Environment variable interpolation: use ${VAR_NAME} syntax.
#   ${VAR}          value of VAR, or contents of the file in VAR_FILE; fails if unset
#   ${VAR:-default} falls back to "default" when unset or empty
#   ${VAR:-}        optional, empty when unset
#   $${             literal "${" (escape; not expanded)
#
# Strategy: "update" (default) creates or updates resources.
#           "create" only creates if missing, skips existing.
# Set globally or per resource (resource strategy overrides global).
# strategy: "update"

roles:
  - name: "app_user"
    password: "${APP_DB_PASSWORD}"     # resolved from environment
    options:
      login: true
      superuser: false
      createdb: false
      createrole: false
      inherit: true                    # inherit privileges of granted roles
      replication: false               # allow logical/physical replication
      bypassrls: false                 # bypass row-level security policies
      connection_limit: -1             # unlimited
      valid_until: "2030-01-01"        # password expiry (omit for no expiry)
    settings:                          # ALTER ROLE ... SET (session defaults)
      statement_timeout: "30s"
      search_path: ["app", "public"]   # list settings as YAML lists
      # work_mem: null                 # null = RESET; omitting a key leaves it unchanged

  - name: "readonly_user"
    password: "${READONLY_DB_PASSWORD}"
    options:
      login: true

  # Read-only monitoring account for postgres_exporter (Prometheus).
  # member_of grants membership in other roles; predefined roles like pg_monitor
  # (read all stats/settings, no table data access) need not be declared above.
  - name: "postgres_exporter"
    password: "${POSTGRES_EXPORTER_PASSWORD}"
    member_of: ["pg_monitor"]
    options:
      login: true
      connection_limit: 5

databases:
  - name: "myapp"
    owner: "app_user"
    settings:                          # ALTER DATABASE ... SET
      TimeZone: "UTC"
    role_settings:                     # ALTER ROLE ... IN DATABASE myapp SET
      readonly_user:
        statement_timeout: "5min"
    # options: create-time only. These cannot be changed with ALTER DATABASE;
    # if the database already exists they are ignored (a warning is logged).
    #   encoding:   character set encoding (e.g. UTF8)
    #   locale:     sets LC_COLLATE and LC_CTYPE together (mutually exclusive
    #               with lc_collate / lc_ctype below)
    #   lc_collate: string sort order (e.g. C)
    #   lc_ctype:   character classification (e.g. C)
    #   template:   template database to clone (e.g. template0)
    # options:
    #   encoding: "UTF8"
    #   lc_collate: "C"
    #   lc_ctype: "C"
    #   template: "template0"
    extensions:
      - "uuid-ossp"                    # plain name
      - "pgcrypto"
      # - name: "pg_trgm"              # or a mapping with options:
      #   schema: "app"                # install into a schema (schemas are created first)
      #   version: "1.6"               # pin; updated with ALTER EXTENSION ... UPDATE TO
      #   cascade: true                # also install required extensions
    schemas:
      - name: "app"
        owner: "app_user"             # optional, defaults to database owner
    revokes:                          # optional: applied before grants
      - role: "PUBLIC"                # PUBLIC = every role
        privileges: ["CONNECT"]
        on_database: true             # REVOKE CONNECT ON DATABASE myapp FROM PUBLIC

    grants:
      - role: "app_user"
        privileges: ["CONNECT"]
        on_database: true             # needed once CONNECT is revoked from PUBLIC

      - role: "app_user"
        privileges: ["ALL"]
        on_schema: "app"              # GRANT ALL ON SCHEMA app TO app_user

      - role: "readonly_user"
        privileges: ["CONNECT"]
        on_database: true             # GRANT CONNECT ON DATABASE myapp TO readonly_user

      - role: "readonly_user"
        privileges: ["USAGE"]
        on_schema: "app"              # GRANT USAGE ON SCHEMA app TO readonly_user

      - role: "readonly_user"
        privileges: ["SELECT"]
        on_tables_in_schema: "app"    # GRANT SELECT ON ALL TABLES + ALTER DEFAULT PRIVILEGES

      - role: "readonly_user"
        privileges: ["EXECUTE"]
        on_functions_in_schema: "app" # functions + procedures; matters when EXECUTE was revoked from PUBLIC

      # A non-owner role that inserts into tables with serial columns also needs
      # sequence privileges (the schema owner, app_user, already has them).
      # Declare the role under roles: first.
      # - role: "writer_user"
      #   privileges: ["USAGE"]
      #   on_schema: "app"
      # - role: "writer_user"
      #   privileges: ["SELECT", "INSERT", "UPDATE", "DELETE"]
      #   on_tables_in_schema: "app"
      # - role: "writer_user"
      #   privileges: ["USAGE", "SELECT"]
      #   on_sequences_in_schema: "app"

      # - role: "readonly_user"
      #   privileges: ["SELECT"]
      #   on_tables: ["app.users"]      # specific tables (schema.table), applied after migrations
      #   columns: ["id", "email"]      # optional column-level grant

    # publications:                     # optional: logical replication (CDC); needs wal_level=logical
    #   - name: "cdc"
    #     tables: ["app.orders"]        # schema-qualified; or all_tables: true
    #     publish: ["insert", "update", "delete"]

    # migrations:                       # optional: Flyway-style SQL migrations
    #   directory: "./migrations/myapp" # supports ${VAR} expansion
    #                                   # File naming:
    #                                   #   V0001__create_users.sql  → versioned (run once, immutable)
    #                                   #   R0001__seed_data.sql     → repeatable (re-run on change)
    #                                   # Tracked via _schema_migrations table with SHA-256 checksums
