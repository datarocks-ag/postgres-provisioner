version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
    groups:
      # testcontainers-go and its modules are released together and must be bumped
      # together; separate PRs conflict on go.mod/go.sum.
      testcontainers:
        patterns:
          - "github.com/testcontainers/testcontainers-go*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    ignore:
      # Dependabot proposed a non-existent major "v2201" for this action (d0007cb),
      # which broke the release workflow. Major updates need a manual review.
      - dependency-name: "vladopajic/go-test-coverage"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "docker"
